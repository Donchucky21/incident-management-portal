apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: incident-portal
  namespace: incident-portal
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-2:304650806285:certificate/da30c8e4-0732-409f-a1cc-109b58bee9fe
    external-dns.alpha.kubernetes.io/hostname: incident.starttechapp.uk
spec:
  ingressClassName: alb
  rules:
    - host: incident.starttechapp.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80