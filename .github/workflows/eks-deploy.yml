name: Deploy Incident Portal to EKS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "kubernetes/**"
      - ".github/workflows/eks-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  EKS_CLUSTER_NAME: chucky-infra-prod
  BACKEND_ECR_REPOSITORY: incident-portal-backend
  FRONTEND_ECR_REPOSITORY: incident-portal-frontend

jobs:
  deploy:
    name: Build, Push and Deploy to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "304650806285"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG" \
            ./backend

          docker push \
            "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG" \
            ./frontend

          docker push \
            "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Connect to EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Create namespace
        run: kubectl apply -f kubernetes/namespace.yaml

      - name: Create database secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-credentials \
            --namespace incident-portal \
            --from-literal=database-name=incident_db \
            --from-literal=database-user=incident_user \
            --from-literal=database-password="$POSTGRES_PASSWORD" \
            --from-literal=database-url="postgresql://incident_user:${POSTGRES_PASSWORD}@postgres:5432/incident_db" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set image tags
        run: |
          sed -i "s/IMAGE_TAG/${GITHUB_SHA}/g" \
            kubernetes/backend.yaml \
            kubernetes/frontend.yaml

      - name: Deploy Kubernetes resources
        run: kubectl apply -k kubernetes

      - name: Wait for application
        run: |
          kubectl rollout status statefulset/postgres \
            --namespace incident-portal \
            --timeout=5m

          kubectl rollout status deployment/backend \
            --namespace incident-portal \
            --timeout=5m

          kubectl rollout status deployment/frontend \
            --namespace incident-portal \
            --timeout=5m

      - name: Show deployed resources
        run: kubectl get pods,services,ingress --namespace incident-portal