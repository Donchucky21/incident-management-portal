name: Terraform Checks

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: Terraform fmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

  validate-and-plan:
    name: Terraform validate and plan
    runs-on: ubuntu-latest
    needs: fmt

    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TF_DB_PASSWORD: ${{ secrets.TF_DB_PASSWORD }}
      TF_ALERT_EMAIL: ${{ vars.TF_ALERT_EMAIL || secrets.TF_ALERT_EMAIL }}
      TF_DOMAIN_NAME: ${{ vars.TF_DOMAIN_NAME || secrets.TF_DOMAIN_NAME }}
      TF_HOSTED_ZONE_NAME: ${{ vars.TF_HOSTED_ZONE_NAME || secrets.TF_HOSTED_ZONE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check required CI variables
        run: |
          set -euo pipefail

          test -n "$AWS_ACCOUNT_ID"
          test -n "$TF_DB_PASSWORD"
          test -n "$TF_ALERT_EMAIL"
          test -n "$TF_DOMAIN_NAME"
          test -n "$TF_HOSTED_ZONE_NAME"

      - name: Write Terraform variables
        run: |
          set -euo pipefail

          jq -n \
            --arg aws_region "$AWS_REGION" \
            --arg account_id "$AWS_ACCOUNT_ID" \
            --arg db_password "$TF_DB_PASSWORD" \
            --arg alert_email "$TF_ALERT_EMAIL" \
            --arg domain_name "$TF_DOMAIN_NAME" \
            --arg hosted_zone_name "$TF_HOSTED_ZONE_NAME" \
            '{
              aws_region: $aws_region,
              project_name: "incident-portal",
              environment: "prod",
              frontend_image_uri: ($account_id + ".dkr.ecr." + $aws_region + ".amazonaws.com/incident-portal-frontend:v1.0.0"),
              backend_image_uri: ($account_id + ".dkr.ecr." + $aws_region + ".amazonaws.com/incident-portal-backend:v1.0.0"),
              db_password: $db_password,
              alert_email: $alert_email,
              domain_name: $domain_name,
              hosted_zone_name: $hosted_zone_name
            }' > terraform/environments/ecs-prod/ci.auto.tfvars.json

      - name: Terraform init
        run: terraform -chdir=terraform/environments/ecs-prod init -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform/environments/ecs-prod validate

      - name: Terraform plan
        run: terraform -chdir=terraform/environments/ecs-prod plan -input=false -no-color
